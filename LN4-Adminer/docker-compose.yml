services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: 1234
      POSTGRES_USER: postgres
      POSTGRES_DB: testdb

  adminer:
    image: adminer:standalone
    ports:
      - "8086:8080"

  gitea:
    image: gitea/gitea:latest
    ports:
      - "3000:3000"
      - "222:22"